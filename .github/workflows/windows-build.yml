name: windows-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    env:
      IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Link release executable (mingwX64)
        run: ./gradlew :apps:windowsApp:linkReleaseExecutableMingwX64 --no-daemon
        shell: bash

      - name: Run shared + windowsApp unit tests
        run: ./gradlew :apps:windowsApp:mingwX64Test --no-daemon
        shell: bash

      - name: Smoke test — --version
        run: |
          $out = & .\apps\windowsApp\build\bin\mingwX64\releaseExecutable\windowsApp.exe --version
          Write-Host $out
          if ($out -notmatch '^abkMyIP \d') { throw "unexpected --version output: $out" }
        shell: pwsh

      - name: Smoke test — --help
        run: |
          $out = & .\apps\windowsApp\build\bin\mingwX64\releaseExecutable\windowsApp.exe --help
          Write-Host $out
          if (-not ($out -match '--json')) { throw "--help did not mention --json: $out" }
        shell: pwsh

      - name: Smoke test — --json (live ipinfo.io call)
        run: |
          $exe = ".\apps\windowsApp\build\bin\mingwX64\releaseExecutable\windowsApp.exe"
          $out = & $exe --json 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "exit=$code"
          Write-Host $out
          if ($code -ne 0) { throw "binary exited $code: $out" }
          if ($out -notmatch '"ip":"') { throw "--json output missing ip field: $out" }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windowsApp-exe
          path: apps/windowsApp/build/bin/mingwX64/releaseExecutable/windowsApp.exe
          if-no-files-found: error
